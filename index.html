<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALLinOne AI — Every AI Model, One Place</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,700;1,9..144,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c10;
    --surface: #0e1318;
    --surface2: #141b22;
    --border: rgba(255,255,255,0.07);
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --accent3: #a855f7;
    --accent4: #22c55e;
    --accent5: #f59e0b;
    --text: #e8edf2;
    --muted: #6b7a8d;
    --glow: 0 0 40px rgba(0,229,255,0.15);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow-x: hidden;
    cursor: none;
  }

  /* CURSOR */
  .cursor {
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%,-50%);
    transition: transform 0.1s, width 0.2s, height 0.2s, background 0.2s;
    mix-blend-mode: difference;
  }
  .cursor-ring {
    width: 36px; height: 36px;
    border: 1.5px solid rgba(0,229,255,0.5);
    border-radius: 50%;
    position: fixed; top: 0; left: 0;
    pointer-events: none; z-index: 9998;
    transform: translate(-50%,-50%);
    transition: transform 0.15s ease-out, width 0.2s, height 0.2s, opacity 0.2s;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 16px 40px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(8,12,16,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo { font-family: 'Syne', sans-serif; font-size: 1.35rem; font-weight: 800; color: var(--text); text-decoration: none; }
  .nav-logo span { color: var(--accent); }
  .nav-links { display: flex; gap: 32px; list-style: none; }
  .nav-links a { color: var(--muted); text-decoration: none; font-size: 0.78rem; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--accent); }
  .nav-cta { background: var(--accent); color: var(--bg); padding: 8px 20px; border-radius: 4px; font-size: 0.78rem; text-transform: uppercase; text-decoration: none; transition: opacity 0.2s; }
  .nav-cta:hover { opacity: 0.85; }

  /* HERO */
  .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 120px 40px 80px; position: relative; overflow: hidden; }
  .hero-bg { position: absolute; inset: 0; background: radial-gradient(ellipse 70% 50% at 50% 0%, rgba(0,229,255,0.07) 0%, transparent 70%), radial-gradient(ellipse 40% 40% at 80% 80%, rgba(168,85,247,0.06) 0%, transparent 60%); }
  .hero-tag { font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); border: 1px solid rgba(0,229,255,0.3); padding: 5px 14px; border-radius: 100px; margin-bottom: 28px; }
  .hero h1 { font-family: 'Syne', sans-serif; font-size: clamp(3.5rem, 8vw, 7.5rem); font-weight: 800; line-height: 0.95; text-align: center; margin-bottom: 24px; position: relative;}
  .hero h1 .line2 { background: linear-gradient(90deg, var(--accent), var(--accent3)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .hero-desc { color: var(--muted); max-width: 520px; text-align: center; line-height: 1.7; margin-bottom: 44px; font-family: 'Fraunces', serif; }

  /* SECTIONS */
  section { padding: 100px 40px; max-width: 1400px; margin: 0 auto; }
  .section-label { font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 12px; }
  .section-title { font-family: 'Syne', sans-serif; font-size: clamp(2rem, 4vw, 3.2rem); margin-bottom: 16px; }
  .section-desc { color: var(--muted); font-size: 0.95rem; line-height: 1.7; max-width: 560px; margin-bottom: 60px; }

  /* SEARCH & FILTERS */
  .search-bar { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; gap: 12px; margin-bottom: 32px; max-width: 480px; transition: border-color 0.2s; }
  .search-bar:focus-within { border-color: var(--accent); }
  .search-bar input { background: transparent; border: none; outline: none; color: var(--text); flex: 1; font-family: 'DM Mono', monospace; }
  
  .cat-nav { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 52px; }
  .cat-btn { padding: 8px 18px; border-radius: 100px; font-size: 0.75rem; text-transform: uppercase; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; }
  .cat-btn:hover, .cat-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(0,229,255,0.05); }

  /* AI GRID & CARDS */
  .ai-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
  
  .ai-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 28px;
    transition: all 0.3s; position: relative; overflow: hidden; display: none; cursor: pointer;
  }
  .ai-card:hover { transform: translateY(-4px); border-color: rgba(255,255,255,0.15); }
  .ai-card.visible { display: block; }
  
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 18px; }
  .card-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; }
  .card-badge { font-size: 0.65rem; text-transform: uppercase; padding: 4px 10px; border-radius: 100px; font-weight: 500; }
  
  /* BADGE COLORS */
  .badge-language { background: rgba(0,229,255,0.1); color: var(--accent); }
  .badge-image { background: rgba(168,85,247,0.1); color: #a855f7; }
  .badge-video { background: rgba(255,107,53,0.1); color: var(--accent2); }
  .icon-language { background: rgba(0,229,255,0.12); }
  .icon-image { background: rgba(168,85,247,0.12); }
  .icon-video { background: rgba(255,107,53,0.12); }

  .card-name { font-family: 'Syne', sans-serif; font-size: 1.15rem; font-weight: 700; margin-bottom: 6px; }
  .card-company { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; margin-bottom: 14px; }
  .card-desc { font-size: 0.85rem; color: rgba(232,237,242,0.7); line-height: 1.65; margin-bottom: 18px; font-family: 'Fraunces', serif; }
  
  .card-features { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .feature-tag { font-size: 0.68rem; padding: 3px 10px; border-radius: 4px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); color: var(--muted); }
  
  .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 18px; border-top: 1px solid var(--border); }
  .card-rating { font-size: 0.75rem; color: var(--accent5); }
  .card-link { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); text-decoration: none; border: 1px solid var(--border); padding: 5px 14px; border-radius: 4px; }
  .card-link:hover { color: var(--accent); border-color: rgba(0,229,255,0.3); }

  .no-results { grid-column: 1/-1; text-align: center; padding: 60px; color: var(--muted); display: none; }
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<nav>
  <a href="#" class="nav-logo">ALLinOne <span>AI</span></a>
  <ul class="nav-links">
    <li><a href="#models">Models</a></li>
  </ul>
  <a href="#models" class="nav-cta">Explore →</a>
</nav>

<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-tag fade-up">The Ultimate AI Directory</div>
  <h1 class="fade-up fade-up-d1">
    <span class="line1">Every AI Model</span>
    <span class="line2">One Place</span>
  </h1>
  <p class="hero-desc">Discover, compare, and choose from top AI models across all categories.</p>
</div>

<section id="models">
  <div class="section-label">// AI Models Directory</div>
  <h2 class="section-title">Browse All AI Models</h2>

  <div class="search-bar">
    <span class="search-icon">⌕</span>
    <input type="text" id="searchInput" placeholder="Search models, companies, features...">
  </div>

  <div class="cat-nav" id="catNav">
    <button class="cat-btn active" data-filter="all">All Models</button>
    <button class="cat-btn" data-filter="language">🧠 Language</button>
    <button class="cat-btn" data-filter="image">🎨 Image</button>
    <button class="cat-btn" data-filter="video">🎬 Video</button>
  </div>

  <div class="card-count" id="cardCount" style="margin-bottom:20px; font-size:12px; color:#6b7a8d;">Showing <span id="visibleCount" style="color:#00e5ff;">0</span> models</div>

  <div class="ai-grid" id="aiGrid">
    <div class="no-results" id="noResults">No models found. Try a different search or filter.</div>
    <!-- CARDS WILL BE GENERATED HERE BY JAVASCRIPT -->
  </div>
</section>

<script>
  // Cursor Animation
  const cursor = document.getElementById('cursor');
  const ring = document.getElementById('cursorRing');
  let mx = 0, my = 0, rx = 0, ry = 0;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; cursor.style.left = mx+'px'; cursor.style.top = my+'px'; });
  function animRing() { rx += (mx - rx) * 0.12; ry += (my - ry) * 0.12; ring.style.left = rx+'px'; ring.style.top = ry+'px'; requestAnimationFrame(animRing); }
  animRing();

  // 1. YOUR DYNAMIC DATABASE
  const databaseModels = [
    {
      id: "gpt-4o",
      category: "language",
      searchTags: "gpt-4o openai language chat reasoning",
      icon: "🧠",
      badgeClass: "badge-language",
      iconClass: "icon-language",
      badgeText: "Language",
      name: "GPT-4o",
      company: "OpenAI · 2024",
      desc: "OpenAI's flagship omnimodel combining text, vision and audio in one unified architecture.",
      features: ["128K context", "Vision", "Function calling", "JSON mode"],
      rating: "4.9",
      url: "https://openai.com/gpt-4o"
    },
    {
      id: "claude-sonnet",
      category: "language",
      searchTags: "claude anthropic sonnet language reasoning",
      icon: "🧠",
      badgeClass: "badge-language",
      iconClass: "icon-language",
      badgeText: "Language",
      name: "Claude 4 Sonnet",
      company: "Anthropic · 2025",
      desc: "Anthropic's most capable model balancing intelligence and speed, with strong reasoning.",
      features: ["200K context", "Vision", "Extended thinking", "Tool use"],
      rating: "4.9",
      url: "https://claude.ai"
    },
    {
      id: "midjourney",
      category: "image",
      searchTags: "midjourney image art generation aesthetic",
      icon: "🎨",
      badgeClass: "badge-image",
      iconClass: "icon-image",
      badgeText: "Image",
      name: "Midjourney v6.1",
      company: "Midjourney Inc. · 2024",
      desc: "The gold standard for artistic AI image generation with unmatched aesthetic quality.",
      features: ["Aesthetic quality", "Style reference", "Character ref", "Inpainting"],
      rating: "4.9",
      url: "https://midjourney.com"
    },
    {
      id: "sora",
      category: "video",
      searchTags: "sora openai video generation",
      icon: "🎬",
      badgeClass: "badge-video",
      iconClass: "icon-video",
      badgeText: "Video",
      name: "Sora",
      company: "OpenAI · 2024",
      desc: "OpenAI's groundbreaking text-to-video model capable of generating cinematic 1080p videos.",
      features: ["1080p output", "20s duration", "Storyboard"],
      rating: "4.8",
      url: "https://openai.com/sora"
    }
  ];

  // 2. RENDER THE CARDS
  const aiGrid = document.getElementById('aiGrid');
  
  function renderModels(models) {
    models.forEach(model => {
      const cardHTML = `
        <div class="ai-card visible" data-cat="${model.category}" data-name="${model.searchTags}" onclick="window.open('${model.url}', '_blank')">
          <div class="card-top">
            <div class="card-icon ${model.iconClass}">${model.icon}</div>
            <span class="card-badge ${model.badgeClass}">${model.badgeText}</span>
          </div>
          <div class="card-name">${model.name}</div>
          <div class="card-company">${model.company}</div>
          <div class="card-desc">${model.desc}</div>
          <div class="card-features">
            ${model.features.map(f => `<span class="feature-tag">${f}</span>`).join('')}
          </div>
          <div class="card-footer">
            <div class="card-rating">★★★★★ <span style="color:var(--muted);margin-left:4px">${model.rating}</span></div>
            <a href="${model.url}" target="_blank" class="card-link" onclick="event.stopPropagation()">Visit →</a>
          </div>
        </div>
      `;
      aiGrid.insertAdjacentHTML('beforeend', cardHTML);
    });
  }

  renderModels(databaseModels);

  // 3. FILTERING & SEARCH LOGIC
  const catBtns = document.querySelectorAll('.cat-btn');
  const searchInput = document.getElementById('searchInput');
  const visibleCount = document.getElementById('visibleCount');
  const noResults = document.getElementById('noResults');
  let currentFilter = 'all';
  let searchTerm = '';

  function updateCards() {
    let count = 0;
    const generatedCards = document.querySelectorAll('.ai-card');
    
    generatedCards.forEach(card => {
      const cat = card.dataset.cat;
      const name = (card.dataset.name || '').toLowerCase();
      const catMatch = currentFilter === 'all' || cat === currentFilter;
      const searchMatch = !searchTerm || name.includes(searchTerm);
      
      if (catMatch && searchMatch) { 
        card.classList.add('visible'); 
        card.style.display = 'block';
        count++; 
      } else { 
        card.classList.remove('visible'); 
        card.style.display = 'none';
      }
    });
    
    visibleCount.textContent = count;
    noResults.style.display = count === 0 ? 'block' : 'none';
  }

  catBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      catBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      updateCards();
    });
  });

  searchInput.addEventListener('input', e => {
    searchTerm = e.target.value.toLowerCase().trim();
    updateCards();
  });

  updateCards();
</script>
</body>
</html>
